name: zena_app
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.7.3
  core_kit:
    git:
      url: https://github.com/kmmuzahid/flutter_core_kit.git
      ref: 1.0.45

  flutter_svg: ^2.2.3
  persistent_bottom_nav_bar_v2: ^6.2.0
  smart_stepper: ^0.0.7
  shared_preferences: ^2.5.4
  geolocator: ^13.0.2
  app_links: ^6.4.0
  url_launcher: ^6.3.2
  shimmer: ^3.0.0
  share_plus:
  socket_io_client: ^3.1.4
  firebase_core: ^4.5.0
  firebase_messaging: ^16.1.2

dependency_overrides:
  share_plus: ^12.0.0
  share_plus_platform_interface: ^6.0.0


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  change_package_name: ^1.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf